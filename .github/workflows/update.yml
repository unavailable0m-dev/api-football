name: Update ESPN snapshots
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: espn-snapshot-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: npm test
      - name: Fetch real ESPN data
        id: fetch
        continue-on-error: true
        run: npm run update
      - name: Commit changed snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/*.json api/leagues/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified ESPN snapshots'
            git push
          fi
      - name: Report upstream failure after saving healthy leagues
        if: steps.fetch.outcome == 'failure'
        run: exit 1
