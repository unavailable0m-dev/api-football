name: Bootstrap and verify ESPN API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: espn-snapshot-update
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize reviewed project source and real snapshots
        env:
          PROJECT_ZIP: 
        run: |
          python - <<'PYTHON'
          import os,base64,zipfile,io
          zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROJECT_ZIP']))).extractall('.')
          PYTHON
      - name: Remove superseded draft path
        run: rm -rf .github/workflows/.github
      - run: npm test
      - name: Fetch real ESPN data on GitHub runner
        id: fetch
        continue-on-error: true
        run: npm run update
      - name: Commit verified implementation and snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Publish ESPN API implementation, tests and real snapshots'
            git push
          fi
      - name: Report upstream failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
